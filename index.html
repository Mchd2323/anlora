<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Anlora — İngilizce Kelime Öğren & Kelime Setleri</title>
    <meta
      name="description"
      content="Oxford 3000 ve Oxford 5000 Ek kelimelerini Türkçe anlamları ve çift dilli örneklerle çalış. Kendi kelime setlerini oluştur, aralıklı tekrarla kalıcı öğren."
    />
    <meta name="theme-color" content="#4F46A5" />
    <meta name="color-scheme" content="light" />

    <!-- Ana ekrana eklenebilir uygulama. Kullanıcı verisinin tamamı zaten
         tarayıcıda durduğu için çevrimdışı çalışma doğal bir gereklilik. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Anlora" />
    <!--
      YAZI TİPLERİ PAKETE GÖMÜLÜDÜR.

      Önceden fonts.googleapis.com'dan çekiliyorlardı. İki sorun vardı:

      1. UYGULAMA ÇEVRİMDIŞI ÇALIŞIYOR. Telefonda internet yokken — yani
         uygulamanın asıl vaat ettiği durumda — yazı tipleri hiçbir zaman
         gelmiyor, arayüz sistem yazı tipine düşüyordu. Seçilen tipografi
         yalnızca internetli kullanıcıya görünüyordu.
      2. Her açılışta boşa giden bir ağ isteği oluyordu.

      Artık yalnızca latin ve latin-ext altkümeleri gömülü (181 KB; Türkçe'nin
      ğ, ş, ı, İ, ö, ü, ç harfleri latin-ext'te). Değişken eksenli dosyalar
      kullanılıyor: her ağırlık için ayrı dosya inmiyor.

      Yeniden üretmek için: python3 scripts/fonts/fetch_fonts.py
      Üç yazı tipi de SIL Open Font License 1.1 ile dağıtılıyor.

      Dosya `preload` ile değil normal bağlantıyla geliyor: yerel dosya
      olduğu için ağ beklemesi yok, boyamayı geciktirmiyor.
    -->
    <link rel="stylesheet" href="/fonts/fonts.css">
  </head>
  <body class="bg-[var(--bg)] text-[var(--text-primary)] antialiased selection:bg-[var(--primary-soft)] selection:text-[var(--primary)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
