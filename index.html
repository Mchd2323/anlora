<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Anlora — İngilizce Kelime Öğren & Kelime Setleri</title>
    <meta
      name="description"
      content="Oxford 3000 ve Oxford 5000 Ek kelimelerini Türkçe anlamları ve çift dilli örneklerle çalış. Kendi kelime setlerini oluştur, aralıklı tekrarla kalıcı öğren."
    />
    <meta name="theme-color" content="#4F46A5" />
    <meta name="color-scheme" content="light" />

    <!-- Ana ekrana eklenebilir uygulama. Kullanıcı verisinin tamamı zaten
         tarayıcıda durduğu için çevrimdışı çalışma doğal bir gereklilik. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Anlora" />
    <!--
      YAZI TİPLERİ BOYAMAYI ENGELLEMEZ.

      Bu bağlantı normal bir stil sayfası olarak duruyordu ve tarayıcı,
      fonts.googleapis.com yanıt verene kadar HİÇBİR ŞEY boyamıyordu. APK
      çevrimdışı çalıştığı için o adres hiçbir zaman yanıt vermiyor; ölçümde
      ilk boyama 12.816 ms'ye kadar gecikiyordu (bağlantı zaman aşımına
      uğrayana dek beyaz ekran). Kullanıcının "tıklayınca geç açılıyor,
      takılıyor" dediği sürenin büyük kısmı buydu.

      `media="print"` ile indirilen stil sayfası boyamayı engellemez; yüklenince
      `media` değeri `all` yapılıp uygulanır. Font gelmezse — çevrimdışıyken
      olacağı gibi — sistem yazı tipiyle devam edilir; index.css'teki yedek
      zincirleri bunun için var. Aynı ölçüm bu değişiklikten sonra 72 ms.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    >
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
    </noscript>
  </head>
  <body class="bg-[#F8F7F3] text-[#1E2430] antialiased selection:bg-[#EEECFA] selection:text-[#4F46A5]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
