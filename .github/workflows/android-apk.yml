name: Android paketi (APK + AAB)

# Anlora'nın Android paketlerini üretir.
#
# İKİ AYRI ÇIKTI, İKİ AYRI İŞ İÇİN:
#   * APK — telefona doğrudan kurulan dosya. Kendi telefonuna, test edenlere
#     ve GitHub Release'ine giden şey budur. Play Store bunu KABUL ETMEZ.
#   * AAB (Android App Bundle) — Play Console'a yüklenen dosya. Google onu
#     açıp her cihaz için ayrı, küçük bir APK üretir; kullanıcı yalnızca kendi
#     ekran yoğunluğuna ve işlemci mimarisine ait parçaları indirir.
#
# AAB YALNIZCA İMZALI ÜRETİLİR. İmzasız (hata ayıklama) bir paket Play'e
# yüklenemez zaten; üretip artefakta koymak, işe yaramaz bir dosyayı işe
# yarar sanmaya davetiye olurdu.
#
# İki tetikleyici vardır:
#   * workflow_dispatch — Actions sekmesinden elle çalıştırılır. Paketler
#     koşunun artefaktı olarak indirilir (bağlantı 90 gün yaşar, GitHub
#     oturumu gerekir).
#   * v* etiketi — kalıcı bir Release oluşturur ve APK'yı ona ekler. Herkese
#     açık, süresiz bir indirme bağlantısı isteniyorsa yol budur. AAB
#     Release'e KONULMAZ: o dosya son kullanıcının kuramayacağı, yalnızca
#     Play Console'a yüklenen bir ara biçimdir.
#
# İMZA. Depo gizlilerinde ANLORA_KEYSTORE_BASE64 tanımlıysa paket o anahtarla
# imzalanmış bir release derlemesi olur; her koşu aynı kimliği taşır, yani
# kullanıcı yeni APK'yı eskisinin üzerine kurabilir ve verisini kaybetmez.
#
# Gizli tanımlı değilse hata ayıklama derlemesine düşülür. O yol yalnızca hızlı
# deneme içindir: Gradle'ın ürettiği hata ayıklama anahtarı makineye özeldir ve
# CI her koşuda temiz bir makinede başladığı için HER APK FARKLI İMZALANIR.
# Android imzası tutmayan paketi güncelleme saymaz; kullanıcı uygulamayı
# kaldırıp kurmak zorunda kalır ve bütün ilerlemesi silinir. Bu yüzden bu yolla
# üretilen paket dağıtılmamalı, Release'e de eklenmez.

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Sunucu adresi (boş bırakılırsa uygulama yalnızca çevrimdışı çalışır)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Testler ve tip denetimi
        run: |
          npm run lint
          npm test

      - name: Web paketini derle
        env:
          # Elle çalıştırmada giriş kutusu, etiketle çalıştırmada depo
          # değişkeni kullanılır. İkisi de boşsa uygulama çevrimdışı kipte
          # derlenir: Oxford çekirdeği çalışır, sunucuya bağlı özellikler
          # (hesap, bulut yedeği, Anlora AI) kapalı olur.
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.API_BASE_URL }}
          # Derleme damgası pakete gömülür ve ses tanısı ekranında görünür.
          # Telefondaki paketin hangi koşudan geldiğini doğrudan gösteriyor;
          # iki farklı APK'nin aynı tanıyı vermesi bu olmadan anlaşılamıyordu.
          ANLORA_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
        # `npm run build` yerine iki komut: o betik ayrıca Node sunucusunu da
        # paketliyor ve APK'nın buna ihtiyacı yok. Ama servis çalışanını üreten
        # adım ATLANMAMALI — atlandığında pakete `public/sw.js`'in ham hâli
        # giriyor, önbellek sürümü sabit kalıyor ve eski varlıklar cihazda
        # hiç temizlenmiyordu.
        run: |
          npx vite build
          node scripts/build-sw.mjs

      - name: Sunucu adresi pakete girdi mi?
        # BU ADIM BİR HATADAN SONRA EKLENDİ.
        #
        # Bir APK, yapay zekâ SESSİZCE KAPALI olarak üretildi ve dağıtıldı.
        # Sebep: iş akışı adres kutusu boş çalıştırıldı, `vars.API_BASE_URL`
        # deposu değişkeni de tanımlı değildi. Sonuç, kullanıcının telefonunda
        # "Bu kelime sözlükte yok, kendin yazabilirsin" — Anlora AI seçeneği
        # hiç görünmüyor. Derlemenin hiçbir yerinde bunu söyleyen bir satır
        # yoktu; başarı yeşil tik olarak göründü.
        #
        # Adres bir SIR DEĞİL (herkese açık bir uç) ama depo herkese açık
        # olduğu için yine de değişkende tutuluyor, iş akışına gömülmüyor.
        # Burada yapılan tek şey, gömülüp gömülmediğini SÖYLEMEK.
        env:
          ADRES: ${{ github.event.inputs.api_base_url || vars.API_BASE_URL }}
        run: |
          if [ -z "$ADRES" ]; then
            echo "::warning::Sunucu adresi verilmedi. Bu APK TAMAMEN ÇEVRİMDIŞI: 20.000 kelimelik sözlük çalışır, Anlora AI çalışmaz. Adres istiyorsanız iş akışını 'Sunucu adresi' kutusunu doldurarak çalıştırın ya da API_BASE_URL depo değişkenini tanımlayın."
            AI_DURUM='**Anlora AI: KAPALI** — pakete sunucu adresi girmedi.'
          elif grep -rqF "$ADRES" dist/assets 2>/dev/null; then
            echo "Sunucu adresi pakete girdi."
            AI_DURUM='**Anlora AI: açık** — sunucu adresi pakete gömüldü.'
          else
            # Adres verildi ama üretilen dosyalarda yok: derleme onu almamış.
            echo "::error::Sunucu adresi verildi ama üretilen pakette bulunamadı; Anlora AI yine kapalı olurdu."
            exit 1
          fi
          {
            echo "### Anlora APK"
            echo
            echo "$AI_DURUM"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Web varlıklarını Android projesine kopyala
        run: npx cap sync android

      - name: Android projesini temizle
        # Artımlı derlemeye güvenilmiyor: eski bir derleme çıktısının APK'ye
        # sızıp sızmadığı ancak sıfırdan derleyerek kesinleşir. Koşu zaten
        # temiz bir çalışma alanında başlıyor, bu adım şüpheyi tamamen
        # ortadan kaldırmak için.
        run: ./gradlew clean --no-daemon
        working-directory: android

      - name: İmza anahtarını hazırla
        id: imza
        env:
          KEYSTORE_BASE64: ${{ secrets.ANLORA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/anlora-release.jks"
            echo "dosya=$RUNNER_TEMP/anlora-release.jks" >> "$GITHUB_OUTPUT"
            echo "var=evet" >> "$GITHUB_OUTPUT"
            echo "İmza anahtarı bulundu: release derlemesi yapılacak."
          else
            echo "var=hayir" >> "$GITHUB_OUTPUT"
            echo "::warning::ANLORA_KEYSTORE_BASE64 tanımlı değil. Hata ayıklama derlemesi üretilecek; bu paket her koşuda farklı imzalanır ve kullanıcıya dağıtılmamalıdır."
          fi

      - name: Paketleri derle
        env:
          ANLORA_KEYSTORE_FILE: ${{ steps.imza.outputs.dosya }}
          ANLORA_KEYSTORE_PASSWORD: ${{ secrets.ANLORA_KEYSTORE_PASSWORD }}
          ANLORA_KEY_ALIAS: ${{ secrets.ANLORA_KEY_ALIAS }}
          ANLORA_KEY_PASSWORD: ${{ secrets.ANLORA_KEY_PASSWORD }}
          # Her çalıştırmada artan benzersiz bir sayı. Play Store aynı
          # versionCode ile ikinci yüklemeyi reddettiği için bu sayının elle
          # yönetilmesi hataya açıktı; run_number bunu kendiliğinden çözer.
          ANLORA_VERSION_CODE: ${{ github.run_number }}
          ANLORA_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
        run: |
          if [ "${{ steps.imza.outputs.var }}" = "evet" ]; then
            # Tek Gradle çağrısı: iki ayrı çağrı aynı işi (kaynak birleştirme,
            # dex) ikinci kez yapar ve koşuyu birkaç dakika uzatırdı.
            ./gradlew assembleRelease bundleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi
        working-directory: android

      - name: APK'yı adlandır
        id: apk
        run: |
          if [ "${{ steps.imza.outputs.var }}" = "evet" ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          DEST="anlora-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: AAB'yi adlandır
        id: aab
        if: steps.imza.outputs.var == 'evet'
        run: |
          SRC=android/app/build/outputs/bundle/release/app-release.aab
          DEST="anlora-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.aab"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: İmzayı doğrula
        # İmzasız ya da beklenmedik anahtarla imzalanmış bir paketin sessizce
        # dağıtılması, bu iş akışının düzeltmek için var olduğu hatanın ta
        # kendisi. Bu yüzden imza koşulu burada ölçülüyor, varsayılmıyor.
        #
        # İKİ AYRI ARAÇ GEREKİYOR. `apksigner` yalnızca APK doğrular; AAB bir
        # APK değil, imzalı bir JAR'dır ve onu `jarsigner` okur. Aynı aracı
        # ikisine de uygulamaya çalışmak, AAB'yi hiç doğrulamadan geçirmek
        # olurdu — Play'e imzasız dosya yüklemek ise koşu bittikten çok sonra,
        # yükleme ekranında anlaşılan bir hatadır.
        if: steps.imza.outputs.var == 'evet'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}"

          echo "--- AAB imzası ---"
          # `-strict` KULLANILMIYOR. O bayrak uyarıları da hataya çeviriyor ve
          # kendi imzaladığımız anahtar zorunlu olarak kendinden imzalı: sertifika
          # zinciri bir kök otoriteye çıkmıyor, jarsigner buna uyarı veriyor ve
          # -strict ile koşu KIRMIZI olurdu. Oysa Play'in beklediği tam olarak
          # budur. Bu yüzden çıktı okunup "jar verified" satırı aranıyor:
          # imzasızlık yine yakalanır, normal uyarı derlemeyi düşürmez.
          jarsigner -verify -certs -verbose:summary "${{ steps.aab.outputs.path }}" \
            | tee "$RUNNER_TEMP/aab-imza.txt" | tail -20
          if ! grep -q "jar verified" "$RUNNER_TEMP/aab-imza.txt"; then
            echo "::error::AAB imzalı değil; Play Console bu dosyayı reddeder."
            exit 1
          fi

      - name: Artefakt olarak yükle (APK)
        uses: actions/upload-artifact@v4
        with:
          name: anlora-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Artefakt olarak yükle (AAB — Play Console için)
        if: steps.imza.outputs.var == 'evet'
        uses: actions/upload-artifact@v4
        with:
          name: anlora-aab
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Koşu özeti
        # Play Console'a yükleme yapan kişinin bilmesi gereken tek sayı
        # versionCode. Play aynı sayıyı ikinci kez kabul etmiyor ve bir
        # yükleme reddedildiğinde sebebi "hangi sayıyı kullanmıştım"
        # sorusunda düğümleniyordu. Sayı burada, koşunun kendi sayfasında
        # yazılı duruyor.
        if: always()
        run: |
          {
            echo "### Paketler"
            echo
            echo "| Alan | Değer |"
            echo "| --- | --- |"
            echo "| versionCode | \`${{ github.run_number }}\` |"
            echo "| versionName | \`${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}\` |"
            echo "| APK (telefona kurulur) | \`${{ steps.apk.outputs.path }}\` |"
            if [ "${{ steps.imza.outputs.var }}" = "evet" ]; then
              echo "| AAB (Play Console'a yüklenir) | \`${{ steps.aab.outputs.path }}\` |"
            else
              echo "| AAB | üretilmedi — imza anahtarı yok |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Etiketliyse Release'e ekle
        # İmzasız paket Release'e EKLENMEZ. Kalıcı bir indirme bağlantısına
        # konulan paket, kullanıcının üzerine güncelleme kurabileceği paketdir;
        # her koşuda kimliği değişen bir APK'yı oraya koymak, kullanıcıyı
        # "kaldır ve yeniden kur" yoluna, yani veri kaybına sürükler.
        if: startsWith(github.ref, 'refs/tags/v') && steps.imza.outputs.var == 'evet'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          body: |
            Anlora ${{ github.ref_name }} — Android paketi.

            Kurulum: APK'yı telefona indirin ve açın. Android "bilinmeyen
            kaynak" uyarısı verirse, uyarıdaki bağlantıdan tarayıcınıza bir
            kereliğine kurulum izni verin.

            Uygulama çevrimdışı çalışır: 20.000 kelime, 24.812 anlam,
            750 kalıp ve 74.436 örnek cümle paketin içindedir.
