name: Ortaç adaylarını ayıkla

# -ed / -ing biçimlerinden hangisinin AYRI bir sözlük anlamı taşıdığını
# ayıklar (trapped = kapana kısılmış, deposited = yatırılmış gibi).
#
# NEDEN CI'DA. Gemini anahtarı yalnızca burada gizli bir değer olarak
# duruyor; ne depoya ne de geliştirme makinesine kopyalanıyor.
#
# SONUÇ DOĞRUDAN SÖZLÜĞE GİRMEZ. Çıktı `scripts/ortac/ayiklanan.json`
# dosyasına yazılıp dala işleniyor; insan gözüyle bakılacak bir ADAY
# listesidir. Uydurma veri yazılmaması kuralı (talimat 59) burada da
# geçerli: betik, karşılık vermeyen ya da karşılığı kelimenin kendisi olan
# cevapları eliyor.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Bu koşuda en fazla kaç aday işlensin? (boş = hepsi)'
        required: false
        default: ''
      sifirla:
        description: 'Önceki sonucu silip baştan başla (evet/hayir)'
        required: false
        default: 'hayir'
      asama:
        description: 'ayikla (1. tur) | dogrula (2. tur) | icerik (3. tur)'
        required: false
        default: 'ayikla'

permissions:
  contents: write

jobs:
  ayikla:
    runs-on: ubuntu-latest
    # Hız sınırına takılırsa beklemeler uzayabilir; koşu yarıda kalsa da
    # kontrol noktası sayesinde bir sonraki koşu kaldığı yerden devam eder.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Anahtarı denetle
        env:
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI" ]; then
            echo "::error::GEMINI_API_KEY tanımlı değil. Settings → Secrets and variables → Actions altından ekleyin."
            exit 1
          fi

      - name: Aday listesini üret
        run: npx tsx scripts/ortac/adaylari_uret.ts

      - name: Gerekiyorsa önceki sonucu sil
        # İstem değiştiğinde eski kararlar karşılaştırılamaz hale geliyor;
        # kontrol noktası onları atlayacağı için baştan koşmak gerekiyor.
        if: ${{ github.event.inputs.sifirla == 'evet' }}
        run: rm -f scripts/ortac/ayiklanan.json

      - name: Ayıkla (1. tur)
        # TAM eşleşme: `!= 'dogrula'` yazıldığında `icerik` aşaması da bu
        # adımı çalıştırıyordu -- yani birinci tur boşuna tekrar koşacaktı.
        if: ${{ github.event.inputs.asama == 'ayikla' || github.event.inputs.asama == '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            npx tsx scripts/ortac/ayikla.ts --limit "${{ github.event.inputs.limit }}"
          else
            npx tsx scripts/ortac/ayikla.ts
          fi

      - name: Doğrula (2. tur)
        if: ${{ github.event.inputs.asama == 'dogrula' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/ortac/dogrula.ts

      - name: İçerik üret (3. tur)
        if: ${{ github.event.inputs.asama == 'icerik' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/ortac/icerik.ts

      - name: Sonucu dala işle
        run: |
          # `git diff` İZLENMEYEN dosyayı görmez; ilk koşuda çıktı yeni bir
          # dosya olduğu için "değişiklik yok" deyip sessizce geçiyordu.
          git add -A scripts/ortac/
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name "Anlora CI"
          git config user.email "noreply@anthropic.com"
          KABUL=$(node -e "const a=require('./scripts/ortac/ayiklanan.json');console.log(a.filter(x=>x.ayriAnlam).length+'/'+a.length)")
          git commit -m "Ortac ayiklama sonucu: $KABUL ayri anlamli"
          # KOŞU SIRASINDA DALA BAŞKA BİR ITME OLABİLİR. Bir kez yaşandı:
          # on altı grupluk içerik turu bitti, 208 kart üretildi ve `git push`
          # "fetch first" diye reddedildi -- sonuç yalnızca koşucunun diskinde
          # kaldığı için tamamen kayboldu. Önce rebase ile üstüne biniliyor.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Özet
        if: always()
        run: |
          test -f scripts/ortac/ayiklanan.json || { echo "Çıktı üretilmedi." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          if [ -f scripts/ortac/icerik.json ]; then
            node -e "
              const k=require('./scripts/ortac/icerik.json');
              console.log('3. tur: '+k.length+' kart üretildi');
              console.log('');
              console.log(k.slice(0,25).map(x=>x.bicim+' ['+x.cefr+'] = '+x.turkishMeanings.join(', ')).join(' · '));
            " >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f scripts/ortac/onaylanan.json ]; then
            node -e "
              const o=require('./scripts/ortac/onaylanan.json');
              const g=o.filter(x=>x.onaylandi);
              console.log('2. tur: '+g.length+'/'+o.length+' onaylandı');
              console.log('');
              console.log(g.slice(0,60).map(x=>x.bicim+' = '+x.turkce).join(' · '));
            " >> "$GITHUB_STEP_SUMMARY"
          fi
          node -e "
            const a=require('./scripts/ortac/ayiklanan.json');
            const e=a.filter(x=>x.ayriAnlam);
            console.log('| Alan | Değer |'); console.log('| --- | --- |');
            console.log('| İşlenen | '+a.length+' |');
            console.log('| Ayrı anlamlı | '+e.length+' |');
            console.log('');
            console.log('İlk 40: '+e.slice(0,40).map(x=>x.bicim+' = '+x.turkce).join(' · '));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Artefakt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ortac-ayiklama
          path: scripts/ortac/ayiklanan.json
          if-no-files-found: error
