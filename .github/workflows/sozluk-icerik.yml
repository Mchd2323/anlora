name: Sözlük içeriği üret

# Genel Dağarcık'ta içeriği eksik anlamları doldurur.
#
# NEDEN CI'DA. Gemini anahtarı yalnızca burada gizli bir değer olarak
# duruyor; ne depoya ne de geliştirme makinesine kopyalanıyor.
#
# BANT SIRASIYLA ÇALIŞTIRIN. Bant numarası sıklık sırasını taşıyor: bant 8,
# bant 13'ten daha sık kullanılan kelimeleri içerir. İş yarıda kalsa bile en
# çok işe yarayacak kısım hazır olsun diye küçük numaralı bantlar önce
# doldurulur.
#
# ÇIKTI DOĞRUDAN PAKETE GİRMEZ: `build_bands.py --strict` kapısından
# geçmeyen içerik uygulamaya yazılmaz.

on:
  workflow_dispatch:
    inputs:
      bant:
        description: 'Hangi bant doldurulsun? (8-13)'
        required: true
        default: '8'
      limit:
        description: 'Bu koşuda en fazla kaç anlam? (boş = hepsi)'
        required: false
        default: ''
      denetle:
        description: 'Var olan bir içerik dosyasını denetle (yol). Doluysa üretim yapılmaz.'
        required: false
        default: ''
      temizle:
        description: 'Denetimde sorunlu bulunanlar dosyadan silinsin mi?'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Anahtarı denetle
        env:
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI" ]; then
            echo "::error::GEMINI_API_KEY tanımlı değil."
            exit 1
          fi

      - name: Var olan içeriği denetle
        if: github.event.inputs.denetle != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.temizle }}" = "true" ]; then
            npx tsx scripts/extended/uret_icerik.ts --denetle "${{ github.event.inputs.denetle }}" --temizle
          else
            npx tsx scripts/extended/uret_icerik.ts --denetle "${{ github.event.inputs.denetle }}"
          fi

      - name: İçerik üret
        if: github.event.inputs.denetle == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            npx tsx scripts/extended/uret_icerik.ts --bant "${{ github.event.inputs.bant }}" --limit "${{ github.event.inputs.limit }}"
          else
            npx tsx scripts/extended/uret_icerik.ts --bant "${{ github.event.inputs.bant }}"
          fi

      - name: İçeriği denetle
        # ASIL KAPI BURASI: denetimi geçemeyen içerik pakete yazılmaz.
        # Burada yalnızca sınanıyor; paket, aşağıda birleşik içerikten
        # yeniden üretiliyor.
        run: python3 scripts/extended/build_bands.py --strict

      - name: Sonucu dala işle
        # PAKET REBASE'DEN SONRA ÜRETİLİYOR. Bantlar paralel koşabilsin diye:
        # her koşu yalnızca kendi içerik dosyasını işler (b9-ai-*.json,
        # b10-ai-*.json -- ayrı dosyalar, çakışmaz). Üretilen paket dosyaları
        # (src/data/extended) ise her koşuda baştan yazılıyor; ikisi birden
        # işlenirse rebase çakışır. O yüzden önce içerik işlenip rebase
        # yapılıyor, paket ondan SONRA birleşik içerikten üretilip ayrı bir
        # commit'e alınıyor. Çakışacak bir şey kalmıyor.
        run: |
          mkdir -p scripts/extended/denetim
          git config user.name "Anlora CI"
          git config user.email "noreply@anthropic.com"
          ETIKET="bant ${{ github.event.inputs.bant }}"
          if [ -n "${{ github.event.inputs.denetle }}" ]; then ETIKET="denetim"; fi

          git add -A scripts/extended/content scripts/extended/denetim scripts/extended/source
          if git diff --cached --quiet; then
            echo "İçerikte değişiklik yok."
            exit 0
          fi
          # TEK SATIR. Çok satırlı `python3 -c` bloğu YAML girintisini bozuyor:
          # devam satırları sütun 1'den başlayınca dosya ayrıştırılamıyor ve
          # iş akışı "workflow_dispatch tetikleyicisi yok" diye reddediliyor.
          SAYI=$(python3 -c "import json,glob;print(sum(len(json.load(open(f))) for f in glob.glob('scripts/extended/content/*.json')))")
          git commit -m "Sozluk icerigi: $ETIKET (toplam $SAYI anlam)"

          for DENEME in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            python3 scripts/extended/build_bands.py --strict
            git add -A src/data/extended
            PAKET=0
            if ! git diff --cached --quiet; then
              git commit -m "Paketi yeniden derle: $ETIKET"
              PAKET=1
            fi
            if git push; then
              echo "İtildi (deneme $DENEME)."
              exit 0
            fi
            echo "İtme reddedildi; başka bir koşu araya girdi. Yeniden deneniyor."
            # YALNIZCA paket commit'i geri alınıyor; içerik commit'i duruyor.
            # Paket bir sonraki turda birleşik içerikten yeniden üretilecek.
            if [ "$PAKET" = "1" ]; then git reset --hard HEAD~1; fi
            sleep $((DENEME * 5))
          done
          echo "::error::İtme beş denemede başarısız oldu."
          exit 1

      - name: Özet
        if: always()
        run: python3 scripts/extended/export_gaps.py --summary >> "$GITHUB_STEP_SUMMARY"
