name: Anlora AI Worker

# Anlora AI vekilini Cloudflare'a dağıtır.
#
# NEDEN CI'DAN. Worker'ı elle dağıtmak için makinede Node ve `wrangler`
# gerekiyor. Bu depoyu kullanan kişinin APK'yı da Actions'tan üretmesi
# bekleniyor; dağıtımı da buraya alınca kurulum tarayıcıdan çıkmadan bitiyor.
#
# GEREKEN İKİ GİZLİ DEĞER (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare'da "Edit Cloudflare Workers" şablonuyla
#                           üretilen jeton.
#   GEMINI_API_KEY        — aistudio.google.com'dan alınan anahtar.
#
# İkisi de GitHub'da gizli kalır; ne depoya ne de APK'ya girer.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gizli değerleri denetle
        # Eksik jetonla dağıtım denemek, wrangler'ın anlaşılması güç bir
        # kimlik hatasıyla düşmesine yol açıyor. Sorunu burada, adıyla
        # söylemek daha yararlı.
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
        run: |
          eksik=0
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN tanımlı değil. Settings → Secrets and variables → Actions altından ekleyin."
            eksik=1
          fi
          if [ -z "$GEMINI" ]; then
            echo "::error::GEMINI_API_KEY tanımlı değil. https://aistudio.google.com/apikey adresinden alıp ekleyin."
            eksik=1
          fi
          exit $eksik

      - name: Bağımlılıkları kur
        # `npm ci` değil: worker/ altında kilit dosyası tutulmuyor, tek
        # bağımlılığı wrangler.
        run: npm install --no-audit --no-fund
        working-directory: worker

      - name: Worker'ı dağıt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
        working-directory: worker

      - name: Gemini anahtarını Worker'a yaz
        # Dağıtımdan SONRA: `secret put` var olan bir Worker'a yazar.
        # Anahtar Cloudflare tarafında saklanır, istemciye hiç gitmez.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Şablonla komut satırına gömmek yerine ortam değişkeni: komut
          # satırı süreç listesinde görünür, ortam değişkeni görünmez.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
        working-directory: worker

      - name: Adresi ve durumu bildir
        # Dağıtımın çalıştığını varsaymak yerine ölçüyoruz: `/api/health`
        # yanıtındaki `ai` alanı, anahtarın gerçekten yerine oturduğunu
        # gösteren tek kanıt.
        #
        # ADRES NEDEN API'DEN SORULUYOR. Önceki sürüm adresi `wrangler deploy`
        # ekran çıktısından ayıklıyordu ve bulamadı: çıktının biçimi wrangler
        # sürümüne göre değişiyor, renk kodları araya giriyor ve log biçimi
        # zaten kararlı bir arayüz değil. Hesabın workers.dev alt alan adı
        # API'de duruyor; adres oradan kurulur, tahmin edilmez.
        #
        # Bu adım bilgi vermek için var, Worker zaten yayında: hiçbir dalı
        # koşuyu kırmızıya çevirmez, en kötü ihtimalle uyarı bırakır.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Deneme basarisiz olursa kullanilabilir modelleri listelemek icin.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          api="https://api.cloudflare.com/client/v4"
          yetki="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          oku() { python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('result');r=(r[0] if r else {}) if isinstance(r,list) else r;print(r.get(sys.argv[1],'') if isinstance(r,dict) else '')" "$1" 2>/dev/null || true; }

          hesap=$(curl -sS "$api/accounts" -H "$yetki" | oku id)
          alt=""
          if [ -n "$hesap" ]; then
            alt=$(curl -sS "$api/accounts/$hesap/workers/subdomain" -H "$yetki" | oku subdomain)
          fi

          if [ -z "$alt" ]; then
            echo "::warning::Adres API'den okunamadı. Cloudflare panelinden alabilirsiniz: Workers & Pages -> anlora-ai"
            exit 0
          fi

          ADRES="https://anlora-ai.$alt.workers.dev"
          durum=$(curl -sS --max-time 20 "$ADRES/api/health" || echo '(yanit alinamadi)')
          echo "Adres: $ADRES"
          echo "Saglik: $durum"

          # GERÇEK BİR KART ÜRETTİRİLİYOR.
          #
          # `/api/health` yalnızca anahtarın TANIMLI olduğunu söyler; Gemini
          # isteğinin biçimi doğru mu, model erişilebilir mi, dönen JSON
          # denetimden geçiyor mu — bunların hiçbirini kanıtlamaz. Biçim
          # hatası ancak kullanıcı APK'da bir kelime aradığında ortaya
          # çıkardı. Bir çağrı burada yapılıp sonucu bildiriliyor.
          # SURE VE ORNEK SAYISI OLCULUYOR, IDDIA EDILMIYOR.
          #
          # Kullanici "6-8 saniye, biraz yavas" ve "uc cumle demistik iki
          # hazirliyor" dedi. Ikisi de olculebilir seyler; her dagitimda
          # olculup ozete yaziliyorlar ki bir sonraki degisikligin gercekten
          # ise yarayip yaramadigi tartisma konusu olmasin.
          # IKI CAGRI, CUNKU BIRI SORUYU CEVAPLAMIYOR.
          #
          # Ilk cagri SOGUK: Worker kopyasi yeni ayaga kalkmis, calisan model
          # onbellegi bos ve Gemini'nin model listesi cekiliyor. Ikinci cagri
          # SICAK: model biliniyor, yalnizca uretim suresi kaliyor.
          # Tek olcum bu ikisini birbirine karistiriyor ve "yavas" sikayetinin
          # kaynagi kesfe mi uretime mi ait, soylenemiyordu.
          # `-D` ile basliklar da aliniyor: `X-Anlora-Denemeler` kartin kac
          # kez uretildigini soyluyor. 2 gorulurse dogrulama ilk denemede
          # dusmus ve sure ikiye katlanmis demektir.
          istek() {
            curl -sS --max-time 90 -D "/tmp/basliklar-$1.txt" \
              -X POST "$ADRES/api/ai/generate-word" \
              -H 'Content-Type: application/json' -d "{\"word\":\"$1\"}" || echo ''
          }
          deneme() {
            grep -i '^x-anlora-denemeler:' "/tmp/basliklar-$1.txt" 2>/dev/null \
              | tr -d '\r' | awk '{print $2}' || echo '?'
          }

          basla=$(date +%s%3N)
          yanit=$(istek serendipity)
          bitir=$(date +%s%3N)
          SOGUK_MS=$((bitir - basla))

          basla=$(date +%s%3N)
          ikinci=$(istek petrichor)
          bitir=$(date +%s%3N)
          SICAK_MS=$((bitir - basla))
          SURE_MS="$SICAK_MS"
          SOGUK_DENEME=$(deneme serendipity); SICAK_DENEME=$(deneme petrichor)
          echo "Soguk: ${SOGUK_MS} ms (${SOGUK_DENEME:-?} deneme) | Sicak: ${SICAK_MS} ms (${SICAK_DENEME:-?} deneme)"
          ORNEKLER=$(printf '%s' "$yanit" | python3 -c "import json,sys;d=json.load(sys.stdin);print('ust duzey: '+str(len(d.get('examples',[])))+' | anlam basina: '+(', '.join(str(len(s.get('examples',[]))) for s in d.get('senses',[])) or 'anlam yok'))" 2>/dev/null || echo '(okunamadi)')
          echo "Ornek sayisi: $ORNEKLER"
          if printf '%s' "$yanit" | grep -q '"turkishMeaning"'; then
            AI_SONUC="çalışıyor — örnek kart üretildi"
            echo "Yapay zeka denemesi: BASARILI"
          else
            AI_SONUC="ÇALIŞMIYOR — aşağıdaki yanıta bakın"
            echo "::warning::Yapay zeka denemesi basarisiz. Worker ayakta ama Gemini cagrisi kart uretemedi."
            echo "Yapay zeka denemesi: BASARISIZ"
            echo "Yanit: $yanit"
            # Basarisizsa kullanilabilir modelleri listele: 404'un nedenini
            # ikinci bir tur beklemeden gormek icin.
            MODELLER=$(curl -sS --max-time 30 "https://generativelanguage.googleapis.com/v1beta/models" -H "x-goog-api-key: $GEMINI_API_KEY" | python3 -c "import json,sys;d=json.load(sys.stdin);print(chr(10).join(m.get('name','') for m in d.get('models',[]) if 'generateContent' in (m.get('supportedGenerationMethods') or [])))" 2>/dev/null)
            if [ -z "$MODELLER" ]; then
              # Ayristirma bos dondu: Google'in hata mesajini yutmak yerine
              # ham yaniti goster, neden orada yaziyor.
              MODELLER=$(curl -sS --max-time 30 "https://generativelanguage.googleapis.com/v1beta/models" -H "x-goog-api-key: $GEMINI_API_KEY" | head -c 800)
              MODELLER="(model listesi ayristirilamadi) ham yanit: $MODELLER"
            fi
            echo "Kullanilabilir modeller:"
            echo "$MODELLER"
          fi

          # Saglik yoklamasi yapay zeka cagrisindan ONCE yapilmisti; o anda
          # hicbir kart uretilmedigi icin `model` alani her zaman null
          # cikiyordu. Denemeden SONRA bir kez daha okunuyor: hangi modelin
          # gercekten calistigi ancak simdi belli.
          durumSon=$(curl -sS --max-time 20 "$ADRES/api/health" || echo "$durum")
          # Bu satir stdout'a da basiliyor: `dusunmeKapali` yalnizca ozet
          # sayfasinda gorunuyordu ve loga bakan onu hic goremiyordu.
          echo "Saglik (denemeden sonra): $durumSon"

          {
            echo "### Anlora AI Worker dağıtıldı"
            echo
            echo "Adres:"
            echo '```'
            echo "$ADRES"
            echo '```'
            echo
            echo "Sağlık yanıtı (yapay zekâ denemesinden sonra):"
            echo '```json'
            echo "$durumSon"
            echo '```'
            echo
            echo 'Yanıtta `"ai": true` görüyorsanız Gemini anahtarı yerine oturmuş demektir.'
            echo
            echo "**Yapay zekâ denemesi:** $AI_SONUC"
            echo
            echo "| Ölçüm | Değer |"
            echo "| --- | --- |"
            echo "| İlk kart (soğuk: model keşfi dahil) | ${SOGUK_MS} ms · ${SOGUK_DENEME:-?} deneme |"
            echo "| Sonraki kart (sıcak: yalnızca üretim) | ${SICAK_MS} ms · ${SICAK_DENEME:-?} deneme |"
            echo "| Örnek cümle sayısı | ${ORNEKLER} |"
            echo
            echo 'Anlam başına **3** bekleniyor; 2 görürsen istem geri gerilemiş demektir.'
            echo
            echo 'Sağlık yanıtındaki `dusunmeKapali` alanı: `true` ise düşünme aşaması'
            echo 'gerçekten kapatıldı; `false` ise model bu alanı reddetti ve her kart'
            echo 'için iki istek gidiyor — o hâlde kapatma işe yaramıyor demektir.'
            if [ "${AI_SONUC#ÇALIŞMIYOR}" != "$AI_SONUC" ]; then
              echo
              echo '```'
              echo "$yanit" | head -c 1500
              echo '```'
              echo
              echo "Bu anahtarla kullanılabilen modeller:"
              echo '```'
              echo "$MODELLER"
              echo '```'
            fi
            echo
            echo "Sıradaki adım: bu adresi **Settings → Secrets and variables → Actions → Variables** sekmesinde \`API_BASE_URL\` adıyla kaydedin, sonra **Android APK** iş akışını çalıştırın."
          } >> "$GITHUB_STEP_SUMMARY"
