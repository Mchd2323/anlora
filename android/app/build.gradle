apply plugin: 'com.android.application'

android {
    namespace "com.anlora.app"
    compileSdk rootProject.ext.compileSdkVersion

    /*
     * Sürüm numaraları ortamdan gelir; yerel derlemede varsayılana düşer.
     *
     * NEDEN. Play Store her yüklemede bir öncekinden BÜYÜK bir versionCode
     * ister; aynı sayıyla ikinci kez yükleme reddedilir. Sabit yazıldığında
     * bu sayıyı elle artırmayı hatırlamak gerekir ve unutulduğu yükleme günü
     * anlaşılır. CI derleme numarasını verdiği için sayı kendiliğinden artar.
     *
     * versionName kullanıcının gördüğü etikettir ("1.2"); versionCode ise
     * yalnızca mağazanın kullandığı sıra numarasıdır. İkisi bağımsızdır.
     *
     * AYRI DEĞİŞKENE ALINMALARININ SEBEBİ. Bunlar `versionCode ... as Integer`
     * biçiminde doğrudan yazılmıştı ve derleme "Value is null" ile kırılıyordu:
     * Groovy o satırı `versionCode(metin) as Integer` diye ayrıştırıyor, yani
     * dönüşümü çağrıdan SONRA uyguluyor ve alana metin geçiyor. Değeri önce
     * burada hesaplamak bu belirsizliği tamamen ortadan kaldırıyor.
     */
    def anloraSurumKodu = (System.getenv("ANLORA_VERSION_CODE") ?: "1").toInteger()
    def anloraSurumAdi = System.getenv("ANLORA_VERSION_NAME") ?: "1.0"

    /*
     * YAYIN İMZASI.
     *
     * NEDEN GEREKLİ. Önceki durumda yayın paketi `assembleDebug` ile
     * üretiliyordu ve hiç signingConfig yoktu; Gradle o zaman kendi ürettiği
     * hata ayıklama anahtarına düşer. O anahtar makineye özeldir: CI her
     * koşuda temiz bir makinede başladığı için HER APK FARKLI BİR KİMLİKLE
     * imzalanıyordu. Android, imzası tutmayan bir paketi güncelleme olarak
     * kabul etmez — kullanıcının uygulamayı kaldırıp yeniden kurması gerekir,
     * bu da bütün ilerlemesinin silinmesi demektir. Veriler yalnızca cihazda
     * durduğu için geri dönüşü yok.
     *
     * Anahtar depoya KONULAMAZ: depo herkese açık, anahtarı gören herkes
     * "Anlora güncellemesi" diye imzalanmış bir paket üretebilirdi. Bu yüzden
     * ortamdan okunuyor; CI'da GitHub Secrets'tan gelir.
     *
     * Anahtar verilmediğinde imzasız kalır ve derleme yine çalışır: yerel
     * geliştirme ve deneme paketleri anahtar gerektirmesin diye.
     */
    def anloraAnahtarDosyasi = System.getenv("ANLORA_KEYSTORE_FILE")
    def anloraAnahtarVar = anloraAnahtarDosyasi != null && !anloraAnahtarDosyasi.isEmpty()

    signingConfigs {
        release {
            if (anloraAnahtarVar) {
                storeFile file(anloraAnahtarDosyasi)
                storePassword System.getenv("ANLORA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANLORA_KEY_ALIAS")
                keyPassword System.getenv("ANLORA_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.anlora.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode anloraSurumKodu
        versionName anloraSurumAdi
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (anloraAnahtarVar) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
